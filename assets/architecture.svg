<svg width="800" height="750" viewBox="0 0 800 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Layer -->
  <rect width="800" height="750" rx="24" fill="#0A0A0F" />
  <rect x="1" y="1" width="798" height="748" rx="23" stroke="#1E1E2E" stroke-width="2" />

  <defs>
    <!-- Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#005B94" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="gray-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E" />
      <stop offset="100%" stop-color="#111118" />
    </linearGradient>

    <!-- Marker Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8888A0" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00D4FF" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F97316" />
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="40" y="50" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="1">QUERYMIND PIPELINE ARCHITECTURE</text>
  <text x="40" y="70" fill="#8888A0" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Autonomous LangGraph Execution Loop with Real-time Trace &amp; Self-Correction</text>

  <!-- Flow Paths / Connecting Lines -->
  <!-- User Question to API Gateway -->
  <path d="M 170 140 L 260 140" stroke="#8888A0" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- Classifier Split -->
  <path d="M 370 160 L 370 210" stroke="#00D4FF" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 420 140 L 530 140" stroke="#8888A0" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Retriever to Generator -->
  <path d="M 370 270 L 370 320" stroke="#8888A0" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Generator to Validator -->
  <path d="M 370 380 L 370 430" stroke="#8888A0" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Validator Branch: Corrector Loop -->
  <path d="M 320 460 L 220 460" stroke="#F97316" stroke-width="2" marker-end="url(#arrow-orange)" />
  <path d="M 170 430 L 170 350 Q 170 330 310 350" stroke="#F97316" stroke-width="2" marker-end="url(#arrow-orange)" />
  <text x="235" y="450" fill="#F97316" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">If Errored</text>

  <!-- Validator to Executor -->
  <path d="M 370 490 L 370 540" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="380" y="515" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">If Valid</text>

  <!-- Executor to Formatter -->
  <path d="M 370 600 L 370 650" stroke="#8888A0" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Formatter / Logger Convergence to Response -->
  <path d="M 420 680 L 590 680" stroke="#8888A0" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 590 170 L 590 640" stroke="#8888A0" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- NODES -->
  
  <!-- 1. User Prompt (Input Node) -->
  <g transform="translate(40, 110)">
    <rect width="130" height="60" rx="12" fill="url(#gray-grad)" stroke="#1E1E2E" stroke-width="1.5" />
    <text x="65" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">User Prompt</text>
    <text x="65" y="44" fill="#555566" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Natural Language</text>
  </g>

  <!-- 2. FastAPI Gateway -->
  <g transform="translate(260, 110)">
    <rect width="160" height="60" rx="12" fill="url(#primary-grad)" stroke="#00D4FF" stroke-width="1" />
    <text x="80" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Classifier Node</text>
    <text x="80" y="44" fill="#E0F7FF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Intent Route (DB/Direct)</text>
  </g>

  <!-- 3. Direct Responder -->
  <g transform="translate(530, 110)">
    <rect width="130" height="60" rx="12" fill="url(#gray-grad)" stroke="#1E1E2E" stroke-width="1.5" />
    <text x="65" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Direct Responder</text>
    <text x="65" y="44" fill="#555566" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Greets / Out of Scope</text>
  </g>

  <!-- 4. Schema Retriever -->
  <g transform="translate(275, 210)">
    <rect width="190" height="60" rx="12" fill="url(#gray-grad)" stroke="#1E1E2E" stroke-width="1.5" />
    <text x="95" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Schema Retriever</text>
    <text x="95" y="44" fill="#8888A0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">PgVector Context Discovery</text>
  </g>

  <!-- 5. SQL Generator -->
  <g transform="translate(275, 320)">
    <rect width="190" height="60" rx="12" fill="url(#gray-grad)" stroke="#1E1E2E" stroke-width="1.5" />
    <text x="95" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SQL Generator</text>
    <text x="95" y="44" fill="#8888A0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">LLM Code Synthesis</text>
  </g>

  <!-- 6. SQL Validator -->
  <g transform="translate(320, 430)">
    <rect width="100" height="60" rx="12" fill="url(#gray-grad)" stroke="#1E1E2E" stroke-width="1.5" />
    <text x="50" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Validator</text>
    <text x="50" y="44" fill="#8888A0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Syntax &amp; Safety Check</text>
  </g>

  <!-- 7. SQL Corrector (Correction Loop Node) -->
  <g transform="translate(120, 430)">
    <rect width="100" height="60" rx="12" fill="url(#orange-grad)" stroke="#F97316" stroke-width="1" />
    <text x="50" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SQL Corrector</text>
    <text x="50" y="44" fill="#FFEDD5" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">LLM Correction Feed</text>
  </g>

  <!-- 8. SQL Executor -->
  <g transform="translate(295, 540)">
    <rect width="150" height="60" rx="12" fill="url(#emerald-grad)" stroke="#10B981" stroke-width="1" />
    <text x="75" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SQL Executor</text>
    <text x="75" y="44" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">PostgreSQL Target Run</text>
  </g>

  <!-- 9. Formatter / Answer Generator -->
  <g transform="translate(275, 650)">
    <rect width="190" height="60" rx="12" fill="url(#gray-grad)" stroke="#1E1E2E" stroke-width="1.5" />
    <text x="95" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Formatter &amp; Logger</text>
    <text x="95" y="44" fill="#8888A0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">LLM Formatting / DB Logs</text>
  </g>

  <!-- 10. API response (Final Output) -->
  <g transform="translate(590, 650)">
    <rect width="170" height="60" rx="12" fill="url(#primary-grad)" stroke="#00D4FF" stroke-width="1" />
    <text x="85" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Structured Response</text>
    <text x="85" y="44" fill="#E0F7FF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Answer + SQL + Trace</text>
  </g>
</svg>
